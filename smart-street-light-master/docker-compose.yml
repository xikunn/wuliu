# 本地联调：PostgreSQL(pgvector) + EMQX
# 用法：docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: streetlight-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5433:5432"
    volumes:
      - streetlight_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.3
    container_name: streetlight-emqx
    ports:
      - "1883:1883"
      - "18083:18083"
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  streetlight_pg_data:
